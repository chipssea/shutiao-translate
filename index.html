<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF8F5" />
<!-- 版本号与更新地址：构建时由 tools/pack.mjs 依据 version.json 注入 -->
<meta name="app-version" content="1.2.0" />
<meta name="update-base" content="https://chipssea.github.io/shutiao-translate/" />
<meta name="description" content="薯条翻译 · 一眼看懂每个词在当前语境里的意思" />
<title>薯条翻译</title>

<!-- PWA / 添加到主屏幕 -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="薯条翻译" />
<meta name="format-detection" content="telephone=no" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">

      <header class="pbar">
        <div class="brand">
          <span class="mark"><img src="icons/icon-192.png" alt="" width="24" height="24" /></span>
          <b>薯条翻译</b>
        </div>
        <div class="pbar-actions">
          <button class="icon-btn user" id="userBtn" data-act="go" data-tab="me" aria-label="我的">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
          </button>
        </div>
      </header>

      <main class="view" id="view"></main>

      <div class="scrim" id="scrim"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
      <div class="toast" id="toast"></div>
      <div class="voice" id="voice" aria-hidden="true">
        <div class="voice-card">
          <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
          <p class="voice-title">正在聆听…</p>
          <p class="voice-hint">中文、英文都可以</p>
        </div>
      </div>

    </div>
    <p class="stage-note">薯条翻译 · 语境直觉英语 · 高保真原型</p>
  </div>

  <script src="lexicon.js"></script>
  <script src="examples.js"></script>
  <script src="corpus.js"></script>
  <script src="roots.js"></script>
  <script src="phonetics.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // 注册 Service Worker（离线可用、可安装）；file:// 下静默跳过
    // 更新策略：静默自动 —— 新版本下载好后自动接管，页面自己刷一次，不打扰用户
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      let hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) { hadController = true; return; }   // 首次安装不算更新
        if (window.__updatingReload) return;
        window.__updatingReload = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) sw.postMessage({ type: 'SKIP_WAITING' });
            });
          });
          // 每次回到前台顺手检查一次新版本
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
